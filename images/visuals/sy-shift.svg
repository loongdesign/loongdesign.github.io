    <line x1="40" y1="80" x2="1160" y2="80" stroke="#eee" stroke-width="1"/>
  </g>
  <text x="60" y="170" font-size="28" font-family="'Lato','Helvetica Neue',Arial,sans-serif" font-weight="300" fill="#222">The shift</text>
